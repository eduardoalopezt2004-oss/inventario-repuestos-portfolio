version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: inventario_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: inventario_repuestos
    volumes:
      - mongodb_data:/data/db
    networks:
      - inventario_network

  # Backend (Node.js + Express)
  backend:
    build: ./backend
    container_name: inventario_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/inventario_repuestos
      - JWT_SECRET=${JWT_SECRET:?Debes crear un archivo .env junto a este docker-compose.yml con JWT_SECRET=<una_clave_larga_y_aleatoria> (ver .env.example)}
      - NODE_ENV=production
    depends_on:
      - mongodb
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    networks:
      - inventario_network

  # Frontend (React)
  frontend:
    build: ./frontend
    container_name: inventario_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventario_network

networks:
  inventario_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
